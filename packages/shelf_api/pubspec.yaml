name: shelf_api
description: A package to declare rest API endpoints that generate into shelf handlers.
version: 1.4.4
homepage: https://github.com/Skycoder42/shelf_api
topics:
  - server
  - shelf
  - dio
  - rest
  - api

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  dio: ^5.9.2
  meta: ^1.18.0
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  rxdart: ^0.28.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.15.0
  dart_pre_commit: ^6.1.2
  dart_test_tools: ^7.2.2
  mockito: ^5.6.4
  riverpod_generator: ^4.0.4-dev.1
  stream_channel: ^2.1.4
  test: ^1.31.0

cider:
  link_template:
    tag: https://github.com/Skycoder42/shelf_api/releases/tag/shelf_api-v%tag%
    diff: https://github.com/Skycoder42/shelf_api/compare/shelf_api-v%from%...shelf_api-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - meta
      - shelf
