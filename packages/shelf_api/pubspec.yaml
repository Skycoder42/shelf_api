name: shelf_api
description: A package to declare rest API endpoints that generate into shelf handlers.
version: 1.4.5
homepage: https://github.com/Skycoder42/shelf_api
topics:
  - server
  - shelf
  - dio
  - rest
  - api

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  collection: ^1.19.1
  dio: ^5.11.0
  meta: ^1.19.0
  riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  rxdart: ^0.28.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.16.0
  dart_pre_commit: ^6.1.4
  dart_test_tools: ^7.3.2
  mockito: ^5.8.1
  riverpod_generator: ^4.0.8
  stream_channel: ^2.1.4
  test: ^1.31.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/shelf_api/releases/tag/shelf_api-v%tag%
    diff: https://github.com/Skycoder42/shelf_api/compare/shelf_api-v%from%...shelf_api-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - meta
      - shelf
