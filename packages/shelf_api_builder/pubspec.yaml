name: shelf_api_builder
description: A code generator to create RESTful API endpoints to be integrated with shelf.
version: 1.3.5
homepage: https://github.com/Skycoder42/shelf_api
topics:
  - server
  - shelf
  - dio
  - rest
  - api

environment:
  sdk: ^3.13.0
resolution: workspace

platforms:
  linux:
  macos:
  windows:

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.10
  build_config: ^1.3.2
  code_builder: ^4.12.0
  dart_test_tools: ^7.3.2
  meta: ^1.19.0
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_api: ^1.4.5
  source_gen: ^4.2.4
  source_helper: ^1.3.13

dev_dependencies:
  build_runner: ^2.16.0
  dart_pre_commit: ^6.1.4
  dio: ^5.11.0
  shelf_router: ^1.1.4
  source_gen_test: ^1.3.7
  test: ^1.31.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/shelf_api/releases/tag/shelf_api_builder-v%tag%
    diff: https://github.com/Skycoder42/shelf_api/compare/shelf_api_builder-v%from%...shelf_api_builder-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - analyzer
      - meta
      - path
      - shelf
