name: shelf_api_builder
description: A code generator to create RESTful API endpoints to be integrated with shelf.
version: 1.3.4-dev.3
homepage: https://github.com/Skycoder42/shelf_api
topics:
  - server
  - shelf
  - dio
  - rest
  - api

environment:
  sdk: ^3.12.0
resolution: workspace

platforms:
  linux:
  macos:
  windows:

dependencies:
  analyzer: ">=12.1.0 <14.0.0"
  build: ^4.0.6
  build_config: ^1.3.0
  code_builder: ^4.11.1
  dart_test_tools: ^7.2.3
  meta: ^1.18.0
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_api: ^1.4.4-dev.2
  source_gen: ^4.2.3
  source_helper: ^1.3.12

dev_dependencies:
  build_runner: ^2.15.0
  dart_pre_commit: ^6.1.3
  dio: ^5.9.2
  source_gen_test: ^1.3.6
  test: ^1.31.0

cider:
  link_template:
    tag: https://github.com/Skycoder42/shelf_api/releases/tag/shelf_api_builder-v%tag%
    diff: https://github.com/Skycoder42/shelf_api/compare/shelf_api_builder-v%from%...shelf_api_builder-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - analyzer
      - meta
      - path
      - shelf
