name: shelf_api_builder
description: A code generator to create RESTful API endpoints to be integrated with shelf.
version: 1.3.7
homepage: https://github.com/Skycoder42/shelf_api
topics:
  - server
  - shelf
  - dio
  - rest
  - api

environment:
  sdk: ^3.13.0
resolution: workspace

platforms:
  linux:
  macos:
  windows:

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.11
  build_config: ^1.3.3
  code_builder: ^4.13.0
  dart_test_tools: ^8.2.0
  meta: ^1.19.0
  path: ^1.9.1
  shelf: ^1.4.3
  shelf_api: ^1.4.5
  source_gen: ^4.2.4
  source_helper: ^1.4.0

dev_dependencies:
  build_runner: ^2.16.1
  dio: ^5.11.1
  shelf_router: ^1.1.5
  source_gen_test: ^1.4.2
  test: ^1.31.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/shelf_api/releases/tag/shelf_api_builder-v%tag%
    diff: https://github.com/Skycoder42/shelf_api/compare/shelf_api_builder-v%from%...shelf_api_builder-v%to%
